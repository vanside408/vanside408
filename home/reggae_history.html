<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>VanSideVibes</title>

	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- BootstrapのCSS読み込み -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- jQuery読み込み -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <!-- BootstrapのJS読み込み -->
    <script src="js/bootstrap.min.js"></script>	
    
    <!-- 全面ホワイトボード化カスタムCSS -->
    <style>
        /* ページ全体を事務所の壁風にし、中央にホワイトボードを配置 */
        body {
            background-color: #2b3033 !important; /* 背景は渋いダークグレー */
            color: #000000 !important;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            padding: 20px 10px;
        }
        
        /* 画面いっぱいに広がるホワイトボード */
        .whiteboard-page {
            background-color: #f7f9fa; /* ホワイトボードの白 */
            border: 10px solid #b0b8bc; /* 太めのアルミフレーム枠 */
            border-radius: 6px;
            padding: 25px 15px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* ボードのヘッダータイトル */
        .board-header {
            text-align: center;
            border-bottom: 3px double #666;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .board-header h1 {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
            color: #111;
        }
        .tamuragumi-sub {
            font-size: 11px;
            color: #777;
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        /* トラック行の設定 */
        .track-row {
            display: flex;
            align-items: center;
            justify-content: space-between; /* 左右にきれいに割り振り */
            border-bottom: 1px dashed #b5bfc4; /* マーカーの手書き点線風 */
            padding: 15px 5px;
        }
        .track-row:last-of-type {
            border-bottom: 2px solid #888; /* 最後の行だけ少し太線 */
        }
        
        /* 左側の情報エリア（トラック名と青札） */
        .track-info-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .track-num {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            width: 75px;
            flex-shrink: 0;
        }
        
        /* 青いマグネット名札（文字色は黒に変更） */
        .blue-magnet-tag {
            background: linear-gradient(135deg, #005bac, #004488); /* 札自体は青 */
            color: #000000 !important; /* 中の文字はしっかり黒 */
            font-size: 13px;
            font-weight: 900; /* 文字を太くして見やすく */
            padding: 5px 14px;
            border-radius: 3px;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.3);
            border-left: 3px solid #002244;
            letter-spacing: 1px;
            display: inline-block;
            text-shadow: 0px 1px 0px rgba(255,255,255,0.3); /* 黒文字が沈まないよううっすら影 */
        }
        
        /* マーカーで書いたようなダウンロードボタン */
        .board-download-btn {
            background-color: transparent;
            color: #ff3333; /* 赤マジック風の赤 */
            border: 2px solid #ff3333;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 4px;
            text-decoration: none !important;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .board-download-btn:hover {
            background-color: #ff3333;
            color: #ffffff !important;
        }
        
        /* ボードの下部（足元） */
        .board-footer {
            text-align: center;
            padding-top: 25px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>

<body>

<!-- 📋 全面ホワイトボードコンテナ -->
<div class="whiteboard-page">

    <!-- ボードのタイトル部分 -->
    <div class="board-header">
        <h1>VanSideVibes</h1>
        <div class="tamuragumi-sub">PROJECT1 / RIDDIM DOWNLOAD LIST</div>
    </div>
    
    <!-- 1曲目 -->
    <div class="track-row">
        <div class="track-info-area">
            <div class="track-num">TRACK 1：</div>
            <div class="blue-magnet-tag">曲名A</div>
        </div>
        <!-- download="〇〇" で保存時のファイル名を指定できます -->
        <a href="audio/track1.mp3" download="track1.mp3" class="board-download-btn">DOWNLOAD</a>
    </div>
    
    <!-- 2曲目 -->
    <div class="track-row">
        <div class="track-info-area">
            <div class="track-num">TRACK 2：</div>
            <div class="blue-magnet-tag">曲名B</div>
        </div>
        <a href="audio/track2.mp3" download="track2.mp3" class="board-download-btn">DOWNLOAD</a>
    </div>
    
    <!-- 3曲目 -->
    <div class="track-row">
        <div class="track-info-area">
            <div class="track-num">TRACK 3：</div>
            <div class="blue-magnet-tag">曲名C</div>
        </div>
        <a href="audio/track3.mp3" download="track3.mp3" class="board-download-btn">DOWNLOAD</a>
    </div>

    <!-- ボード最下部 -->
    <div class="board-footer">
        <p>TAMURAGUMI &copy; VanSideVibes All Rights Reserved.</p>
    </div>

</div>

</body>
</html>
