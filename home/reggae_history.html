<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>VanSideVibes</title>

	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>	
    
    <style>
        /* 画面全体をホワイトボードの白に統一 */
        body {
            background-color: #f7f9fa !important;
            color: #000000 !important;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            padding: 0;
            margin: 0;
        }
        
        /* 全体を囲むアルミフレーム枠 */
        .whiteboard-frame {
            border: 15px solid #b0b8bc;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        
        /* 全体の最大幅 */
        .whiteboard-content {
            max-width: 750px;
            margin: 0 auto;
        }
        
        /* 最上部ヘッダータイトル */
        .board-header {
            text-align: center;
            border-bottom: 5px solid #111;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        .board-header h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            margin: 0 0 8px 0;
            color: #111;
        }
        .tamuragumi-sub {
            font-size: 14px;
            color: #555;
            letter-spacing: 3px;
            font-weight: bold;
        }
        
        /* 各プロジェクトを区切るブロック */
        .project-section {
            margin-bottom: 60px;
            padding-bottom: 10px;
        }
        
        /* プロジェクトの区切りタイトル */
        .project-divider-title {
            font-size: 24px;
            font-weight: bold;
            color: #111;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding: 8px 15px;
            background-color: #e2e8eb;
            border-left: 8px solid #111;
            border-bottom: 1px solid #111;
        }
        
        /* トラック行の設定 */
        .track-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px dashed #b5bfc4;
            padding: 25px 5px;
        }
        .track-row-upper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .track-row:last-of-type {
            border-bottom: 4px double #888;
        }
        
        /* 左側の情報エリア */
        .track-info-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .track-num {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            width: 90px;
            flex-shrink: 0;
        }
        
        /* 曲名（背景なし・直書き手書き風） */
        .track-name-plain {
            font-size: 20px;
            font-weight: bold;
            color: #111;
            letter-spacing: 1px;
        }
        
        /* 青いマグネット名札型のダウンロードボタン（文字色は黒） */
        .blue-magnet-btn {
            background: linear-gradient(135deg, #005bac, #004488);
            color: #000000 !important;
            font-size: 15px;
            font-weight: 900;
            padding: 10px 20px;
            border-radius: 4px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.3);
            border-left: 4px solid #002244;
            letter-spacing: 1px;
            text-decoration: none !important;
            display: inline-block;
            text-shadow: 0px 1px 0px rgba(255,255,255,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            flex-shrink: 0;
            text-align: center;
            min-width: 130px; /* ボタンの横幅を固定して綺麗に揃える */
        }
        .blue-magnet-btn:active {
            transform: translateY(2px);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        /* 再生プレイヤーの設置エリア */
        .audio-player-zone {
            width: 100%;
            margin-top: 5px;
        }
        audio {
            width: 100%;
            height: 40px;
            outline: none;
        }
        
        /* ボードの下部（足元） */
        .board-footer {
            text-align: center;
            padding-top: 50px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="whiteboard-frame">
    <div class="whiteboard-content">

        <div class="board-header">
            <h1>VanSideVibes</h1>
            <div class="tamuragumi-sub">RIDDIM ARCHIVE &amp; PLAYER LIST</div>
        </div>
        
        
        <div class="project-section">
            <div class="project-divider-title">■ PROJECT 1</div>
            
            <div class="track-row">
                <div class="track-row-upper">
                    <div class="track-info-area">
                        <div class="track-num">TRACK 1：</div>
                        <div class="track-name-plain">BLUELIGHT RIDDIM</div>
                    </div>
                    <a href="ns_audio/176_bluelightriddim.mp3" download="176_bluelightriddim.mp3" class="blue-magnet-btn">DOWNLOAD</a>
                </div>
                <div class="audio-player-zone">
                    <audio src="ns_audio/176_bluelightriddim.mp3" controls preload="none"></audio>
                </div>
            </div>
            
            <div class="track-row">
                <div class="track-row-upper">
                    <div class="track-info-area">
                        <div class="track-num">TRACK 2：</div>
                        <div class="track-name-plain">PORT AUGUST</div>
                    </div>
                    <a href="ns_audio/reg5_portaugust.mp3" download="reg5_portaugust.mp3" class="blue-magnet-btn">DOWNLOAD</a>
                </div>
                <div class="audio-player-zone">
                    <audio src="ns_audio/reg5_portaugust.mp3" controls preload="none"></audio>
                </div>
            </div>
            
            <div class="track-row">
                <div class="track-row-upper">
                    <div class="track-info-area">
                        <div class="track-num">TRACK 3：</div>
                        <div class="track-name-plain">RAFF 01</div>
                    </div>
                    <a href="ns_audio/reggae7_raff01.mp3" download="reggae7_raff01.mp3" class="blue-magnet-btn">DOWNLOAD</a>
                </div>
                <div class="audio-player-zone">
                    <audio src="ns_audio/reggae7_raff01.mp3" controls preload="none"></audio>
                </div>
            </div>
        </div>


        <div class="board-footer">
            <p>TAMURAGUMI &copy; VanSideVibes All Rights Reserved.</p>
        </div>

    </div>
</div>

</body>
</html>
