<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>VanSideVibes</title>

	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- BootstrapのCSS読み込み -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 2026年リニューアル：VanSideVibes 専用カスタムデザイン -->
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 60px;
        }
        
        /* ヘッダーデザイン */
        .site-header {
            background-color: #000000;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid #fbc02d; /* レゲエ・ゴールドのアクセントライン */
            margin-bottom: 30px;
        }
        .site-header h1 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        
        /* メインコンテンツ枠 */
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* プロジェクトタイトル */
        .project-title {
            font-size: 24px;
            font-weight: bold;
            color: #fbc02d;
            border-left: 5px solid #fbc02d;
            padding-left: 12px;
            margin-top: 30px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* 楽曲リストスタイル */
        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .track-item {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .track-item:hover {
            background-color: #252525;
        }
        .track-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 15px;
        }
        
        /* ダウンロードボタン */
        .download-btn {
            background-color: #fbc02d;
            color: #000000 !important;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none !important;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .download-btn:hover {
            background-color: #fff176;
        }
        .download-btn:active {
            transform: scale(0.95);
        }
        
        /* フッター（TAMURAGUMIを小さく配置） */
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            border-top: 1px solid #2d2d2d;
        }
        .tamuragumi {
            font-size: 11px;
            color: #666666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .copyright {
            font-size: 10px;
            color: #444444;
        }
    </style>
</head>

<body>

<!-- ヘッダー -->
<div class="site-header">
    <h1>VanSideVibes</h1>
</div>

<!-- メインコンテンツ -->
<div class="main-container">

    <!-- プロジェクト 1 -->
    <div class="project-title">project1</div>
    
    <ul class="track-list">
        <!-- 1曲目 -->
        <li class="track-item">
            <span class="track-name">1. 曲名が入ります</span>
            <!-- 💡 download属性をつけることで、クリックしたときに再生ではなくダウンロードになります -->
            <a href="audio/track1.mp3" download="track1.mp3" class="download-btn">DOWNLOAD</a>
        </li>
        
        <!-- 2曲目 -->
        <li class="track-item">
            <span class="track-name">2. 曲名が入ります</span>
            <a href="audio/track2.mp3" download="track2.mp3" class="download-btn">DOWNLOAD</a>
        </li>
        
        <!-- 3曲目 -->
        <li class="track-item">
            <span class="track-name">3. 曲名が入ります</span>
            <a href="audio/track3.mp3" download="track3.mp3" class="download-btn">DOWNLOAD</a>
        </li>
    </ul>

</div>

<!-- フッター -->
<footer>
    <div class="tamuragumi">TAMURAGUMI</div>
    <div class="copyright">&copy; VanSideVibes All Rights Reserved.</div>
</footer>

</body>
</html>
