<html lang="ja">
<head>

    <!-- BootstrapのCSS読み込み -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- jQuery読み込み -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <!-- BootstrapのJS読み込み -->

    <!-- 画面全体ホワイトボード化・音源再生プレイヤー付きカスタムCSS -->
    <style>
        /* 画面全体をホワイトボードの白に統一 */
        body {
            background-color: #f7f9fa !important;
            color: #000000 !important;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            padding: 0;
            margin: 0;
        }
        
        /* 全体を囲むアルミフレーム枠（画面の縁：10pxから15pxに太くして存在感をアップ） */
        .whiteboard-frame {
            border: 15px solid #b0b8bc;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        
        /* 全体的に大きく表示するために最大幅を750pxに拡大 */
        .whiteboard-content {
            max-width: 750px;
            margin: 0 auto;
        }
        
        /* ボードの最上部ヘッダータイトル（文字サイズを大きく） */
        .board-header {
            text-align: center;
            border-bottom: 5px solid #111; /* マジック線をさらに太く */
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        .board-header h1 {
            font-size: 42px; /* 32px -> 42px に拡大 */
            font-weight: 900;
            letter-spacing: 8px;
            margin: 0 0 8px 0;
            color: #111;
        }
        .tamuragumi-sub {
            font-size: 14px; /* 11px -> 14px に拡大 */
            color: #555;
            letter-spacing: 3px;
            font-weight: bold;
        }
        
        /* 各プロジェクトを区切るブロック */
        .project-section {
            margin-bottom: 60px; /* 余白を広げてメリハリを強化 */
            padding-bottom: 10px;
        }
        
        /* プロジェクトの区切りタイトル（文字サイズと余白を拡大） */
        .project-divider-title {
            font-size: 24px; /* 20px -> 24px に拡大 */
            font-weight: bold;
            color: #111;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding: 8px 15px;
            background-color: #e2e8eb;
            border-left: 8px solid #111; /* 縦線を太く */
            border-bottom: 1px solid #111;
        }
        
        /* トラック行の設定（縦のスペースを広く） */
        .track-row {
            display: flex;
            flex-direction: column; /* スマホやプレイヤー配置を考慮して縦並び要素を整理 */
            gap: 12px;
            border-bottom: 2px dashed #b5bfc4; /* 点線を太く見やすく */
            padding: 25px 5px;
        }
        .track-row-upper {
            display: flex;
            align-items: center;
            justify-content: space-between; /* 上段で曲名とDLボタンを左右に配置 */
            width: 100%;
        }
        .track-row:last-of-type {
            border-bottom: 4px double #888; /* 二重線を太く */
        }
        
        /* 左側の情報エリア */
        .track-info-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .track-num {
            font-size: 18px; /* 14px -> 18px に拡大 */
            font-weight: bold;
            color: #111;
            width: 90px;
            flex-shrink: 0;
        }
        
        /* 青いマグネット名札（サイズを大きく・黒文字をより太く） */
        .blue-magnet-tag {
            background: linear-gradient(135deg, #005bac, #004488);
            color: #000000 !important;
            font-size: 18px; /* 13px -> 18px に拡大 */
            font-weight: 900;
            padding: 8px 22px; /* 札をひと回り大きく */
            border-radius: 4px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.3);
            border-left: 4px solid #002244;
            letter-spacing: 1px;
            display: inline-block;
            text-shadow: 0px 1px 0px rgba(255,255,255,0.4);
        }
        
        /* 再生プレイヤーの設置エリア */
        .audio-player-zone {
            width: 100%;
            margin-top: 5px;
        }
        audio {
            width: 100%; /* 横幅いっぱいにプレイヤーを表示 */
            height: 40px;
            outline: none;
        }
        
        /* マーカーで書いたようなダウンロードボタン（サイズを拡大） */
        .board-download-btn {
            background-color: transparent;
            color: #ff3333;
            border: 3px solid #ff3333; /* 枠線を太く */
            font-weight: bold;
            font-size: 15px; /* 12px -> 15px に拡大 */
            padding: 6px 18px;
            border-radius: 5px;
            text-decoration: none !important;
            transition: all 0.2s;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .board-download-btn:hover {
            background-color: #ff3333;
            color: #ffffff !important;
        }
        
        /* ボードの下部（足元） */
        .board-footer {
            text-align: center;
            padding-top: 50px;
            font-size: 14px; /* 11px -> 14px に拡大 */
            color: #666;
        }
    </style>
</head>
